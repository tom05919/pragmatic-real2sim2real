# Used to refer to the family of environments, e.g., with different numbers of objects. 
env_name: "clutteredstorage2d"

# Passed into prbench.make() to create the environment.
make_kwargs:
  id: "prbench/ClutteredStorage2D-b1-v0"
  target_block_shape: [0.125, 0.3]  # [width, height]
  occupied_percentage: 0.8  # Percentage of shelf width/height occupied by blocker

# Passed into create_bilevel_planning_models() to create the env models.
env_model_kwargs:
  num_blocks: 1